<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Английский — всё, что прошли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14123A; --ink2:#1F1C55; --sur:#272268; --sur2:#332C80;
    --line:#4A42A8; --paper:#F3F1FF; --dim:#B9B3E8;
    --zest:#FFD23F; --mint:#5DD39E; --coral:#FF6B6B; --r:16px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ink);color:var(--paper);
    font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:0 18px 100px}

  .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -18px;
    padding:10px 18px;background:rgba(20,18,58,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .nav[hidden]{display:none}
  .back{font:inherit;font-family:"Unbounded";font-size:13px;font-weight:500;color:var(--paper);
    background:var(--sur);border:1px solid var(--line);border-radius:11px;
    padding:9px 14px;min-height:42px;cursor:pointer;flex:none}
  .back:focus-visible{outline:3px solid var(--zest);outline-offset:2px}
  .navttl{font-family:"Unbounded";font-size:13px;font-weight:500;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .tabs{display:flex;gap:6px;margin:14px 0 0}
  .tab{flex:1;font:inherit;font-family:"Unbounded";font-size:13px;font-weight:500;
    color:var(--dim);background:var(--sur);border:1px solid var(--line);
    border-radius:11px;padding:10px 4px;min-height:44px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--zest);color:#231C00;border-color:var(--zest);font-weight:700}
  .tab:focus-visible{outline:3px solid var(--paper);outline-offset:2px}

  .meter{display:flex;align-items:center;gap:10px;margin:14px 0 0}
  .track{flex:1;height:7px;border-radius:99px;background:var(--sur);overflow:hidden}
  .fill{height:100%;width:0;background:var(--zest);border-radius:99px;transition:width .35s ease}
  .num{font-family:"Unbounded";font-size:12px;color:var(--dim);white-space:nowrap}

  header{padding:32px 0 6px}
  .kicker{font-family:"Unbounded";font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--zest)}
  h1{font-family:"Unbounded";font-weight:700;font-size:clamp(28px,8.5vw,42px);line-height:1.04;margin:10px 0 14px}
  .lead{color:var(--dim);margin:0 0 18px;font-size:15.5px}

  .menu{display:grid;gap:10px;margin-top:8px}
  .item{display:block;width:100%;text-align:left;font:inherit;color:var(--paper);
    background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;cursor:pointer;transition:background .12s ease,transform .12s ease}
  .item:hover{background:var(--sur)}
  .item:active{transform:scale(.99)}
  .item:focus-visible{outline:3px solid var(--zest);outline-offset:2px}
  .item b{display:block;font-family:"Unbounded";font-size:16px;font-weight:700;margin-bottom:3px}
  .item span{color:var(--dim);font-size:14.5px}
  .item .bar{height:5px;border-radius:99px;background:var(--sur);margin-top:12px;overflow:hidden}
  .item .bar i{display:block;height:100%;background:var(--mint);border-radius:99px;width:0}
  .item.vocab{border-color:var(--zest)}

  section{margin-top:34px}
  h2{font-family:"Unbounded";font-weight:700;font-size:19px;line-height:1.2;margin:0 0 12px}
  .card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:17px;overflow-x:auto}
  .card + .card{margin-top:11px}
  .card > :first-child{margin-top:0}
  .card > :last-child{margin-bottom:0}
  .card p{margin:11px 0}

  table{width:100%;border-collapse:collapse;font-size:15.5px}
  th{text-align:left;font-size:12.5px;color:var(--dim);font-weight:500;padding:0 9px 8px 0}
  td{padding:8px 9px 8px 0;border-top:1px solid var(--line);vertical-align:top}
  td:last-child,th:last-child{padding-right:0}
  .tr{color:var(--zest);font-size:14px;white-space:nowrap}
  .ru{color:var(--dim)}
  .no{color:var(--coral)}
  .yes{color:var(--mint)}
  ul.plain{list-style:none;margin:0;padding:0}
  ul.plain li{padding:8px 0;border-top:1px solid var(--line)}
  ul.plain li:first-child{border-top:0}
  .en{font-weight:700}
  .note{font-size:14.5px;color:var(--dim)}

  .q{border-top:1px solid var(--line);padding:16px 0}
  .q:first-child{border-top:0;padding-top:0}
  .qt{font-size:17px;margin:0 0 12px}
  .qt u{text-decoration:none;border-bottom:2px dashed var(--dim);padding:0 20px}
  .qru{display:block;color:var(--dim);font-size:15px;margin-top:3px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  button.opt{font:inherit;font-weight:500;color:var(--paper);background:var(--sur);
    border:1px solid var(--line);border-radius:12px;padding:11px 15px;min-height:46px;
    cursor:pointer;transition:background .12s ease,transform .12s ease;text-align:left}
  button.opt:hover:not(:disabled){background:var(--sur2)}
  button.opt:active:not(:disabled){transform:scale(.98)}
  button.opt:focus-visible{outline:3px solid var(--zest);outline-offset:2px}
  button.opt:disabled{cursor:default;opacity:.5}
  button.opt.right{background:var(--mint);border-color:var(--mint);color:#0C2B1E;opacity:1;font-weight:700}
  button.opt.wrong{background:var(--coral);border-color:var(--coral);color:#3B0B0B;opacity:1}
  .type{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{font:inherit;flex:1;min-width:150px;color:var(--paper);background:var(--sur);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px}
  input[type=text]:focus{outline:3px solid var(--zest);outline-offset:1px}
  input.right{border-color:var(--mint);background:rgba(93,211,158,.18)}
  input.wrong{border-color:var(--coral);background:rgba(255,107,107,.16)}
  .btn{font:inherit;font-family:"Unbounded";font-size:14px;font-weight:700;background:var(--zest);
    color:#231C00;border:0;border-radius:12px;padding:11px 18px;min-height:46px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .btn:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
  .hint{font-size:14.5px;color:var(--dim);margin:10px 0 0}
  .hint.ok{color:var(--mint)}
  .hint.bad{color:var(--coral)}

  /* словарь */
  .vhead{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font:inherit;font-size:14px;color:var(--dim);background:var(--sur);border:1px solid var(--line);
    border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--zest);color:#231C00;border-color:var(--zest);font-weight:700}
  .word{font-family:"Unbounded";font-weight:700;font-size:clamp(26px,7vw,34px);text-align:center;
    padding:22px 8px 6px;line-height:1.15}
  .wtr{text-align:center;color:var(--zest);font-size:15px;padding-bottom:20px}
  .vgrid{display:grid;gap:8px}
  [hidden]{display:none!important}
  footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:14.5px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav" hidden>
    <button class="back" id="back" type="button">← Темы</button>
    <div class="navttl" id="navttl"></div>
  </div>
  <div id="app"></div>
  <footer>Всё, что ты отметил, сохраняется в этом браузере. Можно закрыть и вернуться.</footer>
</div>

<script>
(function(){
/* ============ ДАННЫЕ ============ */

var T = [];

/* --- 1. Present Simple --- */
T.push({
  id:"ps", ttl:"Мой день", sub:"Present Simple, время, наречия частоты",
  rule:[
   {t:"h",x:"Слова"},
   {t:"list",rows:[
    ["wake up","просыпаться"],["get up","вставать"],["take a shower","принимать душ"],
    ["brush my teeth","чистить зубы"],["get dressed","одеваться"],
    ["have breakfast / lunch / dinner","завтракать / обедать / ужинать"],
    ["go to school","идти в школу"],["come home","приходить домой"],
    ["do homework","делать уроки"],["watch TV","смотреть телевизор"],
    ["play video games","играть в видеоигры"],["chill with the family","отдыхать с семьёй"],
    ["go to bed","ложиться спать"],["all","весь, полный"],["every","каждый"],
    ["with","с"],["noon","полдень"]
   ]},
   {t:"h",x:"AM и PM"},
   {t:"p",x:"AM — время до полудня, 00:00–11:59. PM — после полудня, 12:00–23:59."},
   {t:"table",head:["12 часов","24 часа"],rows:[["1 AM","01:00"],["7 AM","07:00"],["12 (Noon)","12:00"],["1 PM","13:00"],["7 PM","19:00"],["10 PM","22:00"],["12 (Midnight)","00:00"]]},
   {t:"h",x:"Present Simple — то, что всегда"},
   {t:"p",x:"Для привычек и повторяющихся действий."},
   {t:"table",head:["Кто","Что делаем с глаголом"],rows:[
    ["I / You / We / They","глагол без изменений"],
    ["He / She / It","глагол + s"]]},
   {t:"list",rows:[["I read books every day.","Я читаю книги каждый день"],["He wakes up at six.","Он встаёт в шесть"],["She goes to school by bus.","Она ездит в школу на автобусе"]]},
   {t:"note",x:"have → has. Не haves! I have a brother, но She has a brother."},
   {t:"note",x:"Если глагол кончается на -s, -x, -ch, -sh, -o, добавляем -es: watches, goes, brushes."},
   {t:"h",x:"Отрицание"},
   {t:"table",head:["Кто","Форма"],rows:[["I / You / We / They","don't + глагол"],["He / She / It","doesn't + глагол"]]},
   {t:"note",x:"После doesn't глагол всегда без -s: s уже забрал себе does."},
   {t:"h",x:"Как часто"},
   {t:"table",head:["Слово","Сколько это","Перевод"],rows:[
    ["always","100%","всегда"],["usually","80%","обычно"],["often","60%","часто"],
    ["sometimes","40%","иногда"],["rarely","20%","редко"],["never","0%","никогда"]]},
   {t:"p",x:"С обычными глаголами — ПЕРЕД глаголом: I always wake up at 7. С глаголом to be — ПОСЛЕ него: She is always late."},
   {t:"h",x:"Так нельзя / так правильно"},
   {t:"pairs",rows:[["He wake up at six.","He wakes up at six."],["She don't watch TV.","She doesn't watch TV."],["He doesn't gets up early.","He doesn't get up early."],["I always am tired.","I am always tired."],["She goes always to school.","She always goes to school."]]}
  ],
  drill:[
   {t:"c",q:"He ___ up at six.",o:["wake","wakes"],k:1},
   {t:"c",q:"My sister ___ breakfast at 8.",o:["have","has"],k:1},
   {t:"c",q:"We ___ TV in the morning.",o:["don't watch","doesn't watch"],k:0},
   {t:"c",q:"She ___ to school by bus.",o:["go","goes"],k:1},
   {t:"c",q:"He ___ up early on Sundays.",o:["doesn't get","doesn't gets"],k:0},
   {t:"c",q:"She ___ her teeth twice a day.",o:["brushs","brushes"],k:1},
   {t:"c",q:"Поставь always:",ru:"I wake up at 7.",o:["I always wake up at 7.","I wake always up at 7."],k:0},
   {t:"c",q:"Поставь never:",ru:"She watches TV in the morning.",o:["She watches never TV.","She never watches TV in the morning."],k:1},
   {t:"c",q:"Поставь always:",ru:"My mum is busy.",o:["My mum always is busy.","My mum is always busy."],k:1},
   {t:"c",q:"Поставь sometimes:",ru:"They play football on Sundays.",o:["They sometimes play football on Sundays.","They play sometimes football on Sundays."],k:0}
  ],
  hw:[
   "Расставить наречия частоты в правильном месте — 15 предложений.",
   "Письменно: 10 предложений о том, как проходит один день кого-то из родителей."
  ]
});

/* --- 2. Family --- */
T.push({
  id:"fam", ttl:"Семья", sub:"have got, притяжательный 's, вопросы с to be",
  rule:[
   {t:"h",x:"Кто есть кто"},
   {t:"list",rows:[
    ["mum / mother","мама"],["dad / father","папа"],["parents","родители"],
    ["brother","брат"],["sister","сестра"],["only child","единственный ребёнок"],
    ["grandma / grandmother","бабушка"],["grandpa / grandfather","дедушка"],
    ["aunt","тётя"],["uncle","дядя"],["cousin","двоюродный брат или сестра — «казн», не «коусин»"],
    ["husband","муж"],["wife","жена"],["son","сын"],["daughter","дочь — «доутэ»"]
   ]},
   {t:"h",x:"have got — у меня есть"},
   {t:"table",head:["Кто","Форма"],rows:[["I / You / We / They","have got"],["He / She / It","has got"]]},
   {t:"list",rows:[["I have got a brother.","У меня есть брат"],["She has got two sisters.","У неё две сестры"],["We have got a big family.","У нас большая семья"]]},
   {t:"note",x:"Часто сокращают: I have got = I've got. She has got = She's got."},
   {t:"h",x:"Нет и вопрос"},
   {t:"list",rows:[["I haven't got a sister.","У меня нет сестры"],["He hasn't got a brother.","У него нет брата"],["Have you got a sister?","У тебя есть сестра?"],["Has he got a brother?","У него есть брат?"]]},
   {t:"p",x:"Короткие ответы: Yes, I have. / No, I haven't. Yes, she has. / No, she hasn't."},
   {t:"h",x:"Вопрос с to be"},
   {t:"p",x:"Глагол выходит вперёд и меняется местами с тем, о ком речь."},
   {t:"list",rows:[["I am ready. → Am I ready?","Я готов. → Готов ли я?"],["You are late. → Are you late?","Ты опаздываешь. → Опаздываешь ли ты?"],["She is a doctor. → Is she a doctor?","Она врач. → Она врач?"],["They are happy. → Are they happy?","Они счастливы. → Они счастливы?"]]},
   {t:"h",x:"Чьё это — апостроф + s"},
   {t:"list",rows:[["my sister's name","имя моей сестры"],["Diana's phone","телефон Дианы"],["my mum's car","машина моей мамы"]]},
   {t:"note",x:"Не путать с is. My sister's name is Anna — здесь 's = принадлежность. My sister is Anna — здесь is = глагол. Пишется одинаково, различаем по смыслу."},
   {t:"note",x:"Если слово уже кончается на -s (много), ставим только апостроф: my parents' car — машина родителей."},
   {t:"h",x:"Так нельзя / так правильно"},
   {t:"pairs",rows:[["He has got a sisters.","He has got a sister."],["Have they got a parents?","Have they got parents?"],["Has he got mom?","Has he got a mum?"],["He is schoolboy.","He is a schoolboy."],["Was you ready?","Are you ready?"],["My brothers car","my brothers' car"]]}
  ],
  drill:[
   {t:"c",q:"I ___ one brother.",o:["have got","has got"],k:0},
   {t:"c",q:"She ___ two sisters.",o:["have got","has got"],k:1},
   {t:"c",q:"My parents ___ a small house.",o:["have got","has got"],k:0},
   {t:"c",q:"My grandma ___ a beautiful garden.",o:["have got","has got"],k:1},
   {t:"c",q:"Отрицание:",ru:"She has got a cat.",o:["She hasn't got a cat.","She haven't got a cat."],k:0},
   {t:"c",q:"Вопрос:",ru:"They have got a big house.",o:["Has they got a big house?","Have they got a big house?"],k:1},
   {t:"c",q:"Короткий ответ на «Has she got a cousin?» (да)",o:["Yes, she has.","Yes, she have."],k:0},
   {t:"c",q:"the phone of my brother",o:["my brother's phone","my brothers phone"],k:0},
   {t:"c",q:"the room of my parents",o:["my parent's room","my parents' room"],k:1},
   {t:"c",q:"Вопрос:",ru:"We are at home.",o:["Are we at home?","We are at home?"],k:0},
   {t:"c",q:"Вопрос:",ru:"He is a schoolboy.",o:["Is he a schoolboy?","Is he schoolboy?"],k:0}
  ],
  hw:[
   "Составить 5–6 вопросов о том, у кого что есть (have got / has got)."
  ]
});

/* --- 3. There is / There are --- */
T.push({
  id:"tia", ttl:"Моя комната", sub:"there is / there are, мебель, предлоги места",
  rule:[
   {t:"h",x:"Комнаты"},
   {t:"vlist",rows:[
    ["a house","хаус","дом (частный)"],["a flat","флэт","квартира; в Америке an apartment"],
    ["a room","рум","комната"],["a kitchen","китчин","кухня"],["a bedroom","бедрум","спальня"],
    ["a bathroom","баθрум","ванная"],["a living room","ливин рум","гостиная"],["a hall","хол","прихожая, коридор"]]},
   {t:"h",x:"Мебель и предметы"},
   {t:"vlist",rows:[
    ["a bed","бэд","кровать"],["a table","тэйбл","стол"],["a desk","дэск","письменный стол"],
    ["a chair","чэа","стул"],["a sofa","соуфа","диван"],["a wardrobe","уодроуб","шкаф для одежды"],
    ["a shelf","шелф","полка — много: shelves"],["a window","уиндоу","окно"],["a door","дор","дверь"],
    ["a lamp","лэмп","лампа"],["a carpet","капит","ковёр"],["a mirror","мира","зеркало"],
    ["a picture","пикча","картина"],["a TV","ти-ви","телевизор"],["a wall","воол","стена"]]},
   {t:"h",x:"there is / there are"},
   {t:"p",x:"Означает «есть», «имеется», «находится». Нужно, когда описываем, что где находится: комнату, город, стол."},
   {t:"p",x:"По-русски: В моей комнате → есть → стол. По-английски порядок другой: There is → a table → in my room."},
   {t:"table",head:["Форма","Когда","Пример"],rows:[
    ["There is","один предмет, обычно с a / an","There is a sofa in the living room."],
    ["There are","два и больше, у существительного -s","There are four chairs in the kitchen."]]},
   {t:"note",x:"There is сокращается до There's. There are НЕ сокращается, пишем полностью."},
   {t:"h",x:"Нет и вопрос"},
   {t:"list",rows:[
    ["There isn't a TV in my bedroom.","В спальне нет телевизора"],
    ["There aren't any pictures on the wall.","На стене нет картин"],
    ["There is no TV in my bedroom.","Второй способ сказать «нет» — через no, без артикля"],
    ["Is there a lamp on the table?","На столе есть лампа?"],
    ["Are there any chairs in the hall?","В прихожей есть стулья?"]]},
   {t:"p",x:"Короткие ответы: Yes, there is. / No, there isn't. Yes, there are. / No, there aren't. Предмет НЕ повторяем — не «Yes, there is a mirror», а просто «Yes, there is»."},
   {t:"h",x:"a / an / some / any"},
   {t:"table",head:["Слово","Где","Пример"],rows:[
    ["a / an","перед одним предметом; an, если дальше гласный звук","There is a chair. / There is an armchair."],
    ["some","в утверждении перед множественным","There are some books on the desk."],
    ["any","в отрицании и вопросе перед множественным","There aren't any lamps. / Are there any lamps?"]]},
   {t:"h",x:"Предлоги места"},
   {t:"table",head:["Предлог","Перевод","Пример"],rows:[
    ["in","в, внутри","There is a table in my room."],
    ["on","на поверхности","There are some books on the shelf."],
    ["under","под","There are slippers under the chair."],
    ["next to","рядом с","There is a bed next to the window."],
    ["behind","за, позади","There is a wardrobe behind the door."],
    ["in front of","перед, напротив","There is a mirror in front of the desk."],
    ["between","между","The lamp is between the bed and the table."]]},
   {t:"h",x:"Так нельзя / так правильно"},
   {t:"pairs",rows:[
    ["In my room is a table.","There is a table in my room."],
    ["There are a chair in the hall.","There is a chair in the hall."],
    ["There is two windows.","There are two windows."],
    ["There are three window.","There are three windows."],
    ["There are some books on the shelf?","Are there any books on the shelf?"],
    ["Yes, there is a mirror.","Yes, there is."],
    ["There is table in my room.","There is a table in my room."],
    ["There is wardrobe is behind the door.","There is a wardrobe behind the door."]]}
  ],
  drill:[
   {t:"c",q:"___ a lamp on the desk.",o:["There is","There are"],k:0},

var KEY="course-v1", S={};
try{ S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ S={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
var app=document.getElementById("app"), nav=document.getElementById("nav"), navttl=document.getElementById("navttl");

function solved(t){ var n=0; t.drill.forEach(function(_,i){ if(S["q:"+t.id+i]===true) n++; }); return n; }

function home(){
  nav.hidden=true; app.innerHTML="";

  h.appendChild(el("p","lead","Выбери тему. В каждой — правило и тренажёр. Ответов нигде не видно, проходить можно сколько угодно раз."));
  app.appendChild(h);

  var m=el("div","menu");
  T.forEach(function(x,i){
    var b=el("button","item"); b.type="button";
    b.appendChild(el("b",null,(i+1)+". "+x.ttl));
    b.appendChild(el("span",null,x.sub));
    var bar=el("div","bar"), f=el("i");
    f.style.width=Math.round(solved(x)/x.drill.length*100)+"%";

    b.addEventListener("click",function(){ topic(x); });

function block(b){
  if(b.t==="h"){ var h=el("h2",null,b.x); return h; }
  var c=el("div","card");
  if(b.t==="p"){ c.appendChild(el("p",null,b.x)); }
  if(b.t==="note"){ var p=el("p","note",b.x); c.appendChild(p); }
  if(b.t==="table"){
    var tb=el("table"), hr=el("tr");
    b.head.forEach(function(x){ hr.appendChild(el("th",null,x)); });
    tb.appendChild(hr);
    b.rows.forEach(function(r){ var x=el("tr"); r.forEach(function(v){ x.appendChild(el("td",null,v)); }); tb.appendChild(x); });
    c.appendChild(tb);
  }
  if(b.t==="list"){
    var u=el("ul","plain");
    b.rows.forEach(function(r){
      var li=el("li"); li.appendChild(el("span","en",r[0]));
      li.appendChild(document.createTextNode(" "));
      li.appendChild(el("span","ru","— "+r[1])); u.appendChild(li);
    });
    c.appendChild(u);
  }
  if(b.t==="vlist"){
    var tb2=el("table"), hr2=el("tr");
    ["Слово","Звучит","Перевод"].forEach(function(x){ hr2.appendChild(el("th",null,x)); });
    tb2.appendChild(hr2);
    b.rows.forEach(function(r){
      var x=el("tr");
      x.appendChild(el("td","en",r[0]));
      x.appendChild(el("td","tr",r[1]));
      x.appendChild(el("td","ru",r[2]));
      tb2.appendChild(x);
    });
    c.appendChild(tb2);
  }
  if(b.t==="pairs"){
    var tb3=el("table"), hr3=el("tr");
    hr3.appendChild(el("th",null,"Так нельзя")); hr3.appendChild(el("th",null,"Так правильно"));
    tb3.appendChild(hr3);
    b.rows.forEach(function(r){
      var x=el("tr");
      x.appendChild(el("td","no",r[0]));
      x.appendChild(el("td","yes",r[1]));
      tb3.appendChild(x);
    });
    c.appendChild(tb3);
  }
  return c;
}

function topic(t){
  nav.hidden=false; navttl.textContent=t.ttl; app.innerHTML=""; window.scrollTo(0,0);
  var h=el("header");
  h.appendChild(el("div","kicker","Тема"));
  h.appendChild(el("h1",null,t.ttl));
  app.appendChild(h);

  var tabs=el("div","tabs");
  var b1=el("button","tab","Правило"), b2=el("button","tab","Тренажёр"), b3=el("button","tab","Домашка");
  b1.type="button"; b2.type="button"; b3.type="button";
  tabs.appendChild(b1); tabs.appendChild(b2);
  if(t.hw && t.hw.length) tabs.appendChild(b3);
  app.appendChild(tabs);

  var meter=el("div","meter"), tr=el("div","track"), fl=el("div","fill"), nm=el("div","num");
  fl.id="fl"; tr.appendChild(fl); meter.appendChild(tr); meter.appendChild(nm); app.appendChild(meter);

  var body=el("div"); app.appendChild(body);

  function upd(){
    var n=solved(t);
    fl.style.width=Math.round(n/t.drill.length*100)+"%";
    nm.textContent=n+" / "+t.drill.length;
  }

  function selTab(x){ b1.setAttribute("aria-selected",String(x==="r")); b2.setAttribute("aria-selected",String(x==="d")); b3.setAttribute("aria-selected",String(x==="h")); }
  function showRule(){
    selTab("r");
    meter.style.display="none"; body.innerHTML="";
    var s=el("section");
    t.rule.forEach(function(b){ s.appendChild(block(b)); });
    body.appendChild(s); window.scrollTo(0,0);
  }
  function showHw(){
    selTab("h");
    meter.style.display="none"; body.innerHTML="";
    var s=el("section"), c=el("div","card"), ol=document.createElement("ol");
    ol.style.margin="0"; ol.style.paddingLeft="20px";
    t.hw.forEach(function(x){ var li=document.createElement("li"); li.style.padding="7px 0"; li.textContent=x; ol.appendChild(li); });
    c.appendChild(ol); s.appendChild(c);
    body.appendChild(s); window.scrollTo(0,0);
  }
  function showDrill(){
    selTab("d");
    meter.style.display="flex"; body.innerHTML="";
    var s=el("section"), c=el("div","card");
    t.drill.forEach(function(q,i){ c.appendChild(item(t.id,i,q,upd)); });
    s.appendChild(c);
    var r=el("button","btn ghost","Начать заново"); r.type="button";
    r.style.marginTop="14px";
    r.addEventListener("click",function(){
      t.drill.forEach(function(_,i){ delete S["q:"+t.id+i]; }); save(); showDrill(); upd();
    });
    s.appendChild(r);
    body.appendChild(s); upd(); window.scrollTo(0,0);
  }
  b1.addEventListener("click",showRule); b2.addEventListener("click",showDrill); b3.addEventListener("click",showHw);
  showRule(); upd();
}

function item(tid,i,q,upd){
  var id="q:"+tid+i, box=el("div","q"), p=el("p","qt");
  p.innerHTML=(q.q||"").replace("___","<u></u>");
  if(q.ru) p.appendChild(el("span","qru",q.ru));
  box.appendChild(p);
  var hint=el("p","hint");

  if(q.t==="c"){
    var o=el("div","opts");
    q.o.forEach(function(x,j){
      var b=el("button","opt",x); b.type="button";
      b.addEventListener("click",function(){
        if(b.disabled) return;
        if(j===q.k){
          b.classList.add("right"); hint.className="hint ok"; hint.textContent="Верно";
          Array.prototype.forEach.call(o.children,function(y){ y.disabled=true; });
          S[id]=true; save(); upd();
        } else {
          b.classList.add("wrong"); b.disabled=true;
          hint.className="hint bad"; hint.textContent="Не то. Попробуй ещё раз.";
        }
      });
      o.appendChild(b);
    });
    if(S[id]===true){
      o.children[q.k].classList.add("right");
      Array.prototype.forEach.call(o.children,function(y){ y.disabled=true; });
      hint.className="hint ok"; hint.textContent="Верно";
    }
    box.appendChild(o);
  } else {
    var row=el("div","type"), inp=el("input"), btn=el("button","btn","Проверить");
    inp.type="text"; inp.placeholder="напиши здесь"; inp.autocapitalize="none"; inp.spellcheck=false; btn.type="button";
    function norm(v){ return v.trim().toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," "); }
    function go(){
      var v=norm(inp.value); if(!v) return;
      var ok=q.a.some(function(a){ return norm(a)===v; });
      if(ok){
        inp.className="right"; inp.disabled=true; btn.disabled=true;
        hint.className="hint ok"; hint.textContent="Верно";
        S[id]=true; save(); upd();
      } else { inp.className="wrong"; hint.className="hint bad"; hint.textContent="Пока нет. Загляни в правило."; }
    }
    btn.addEventListener("click",go);
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
    if(S[id]===true){ inp.value=q.a[0]; inp.className="right"; inp.disabled=true; btn.disabled=true; hint.className="hint ok"; hint.textContent="Верно"; }
    row.appendChild(inp); row.appendChild(btn); box.appendChild(row);
  }
  box.appendChild(hint);
  return box;
}

function vocab(){
  nav.hidden=false; navttl.textContent="Словарь"; app.innerHTML=""; window.scrollTo(0,0);
  var dir=S.vdir||"er", pool=V.slice(), cur=null, score=0, seen=0;

  var h=el("header");
  h.appendChild(el("div","kicker","Словарь"));
  h.appendChild(el("h1",null,"Слова"));
  app.appendChild(h);

  var head=el("div","vhead");
  var c1=el("button","chip","англ → рус"), c2=el("button","chip","рус → англ");
  c1.type="button"; c2.type="button";
  head.appendChild(c1); head.appendChild(c2); app.appendChild(head);

  var stat=el("p","lead"); app.appendChild(stat);
  var card=el("div","card"); app.appendChild(card);

  function setDir(d){
    dir=d; S.vdir=d; save();
    c1.setAttribute("aria-pressed",String(d==="er"));
    c2.setAttribute("aria-pressed",String(d==="re"));
    score=0; seen=0; next();
  }
  c1.addEventListener("click",function(){ setDir("er"); });
  c2.addEventListener("click",function(){ setDir("re"); });

  function pick(n,not){
    var out=[], guard=0;
    while(out.length<n&&guard<400){
      guard++;
      var w=pool[Math.floor(Math.random()*pool.length)];
      if(w===not) continue;
      if(out.indexOf(w)>=0) continue;
      out.push(w);
    }
    return out;
  }

  function next(){
    cur=pool[Math.floor(Math.random()*pool.length)];
    card.innerHTML="";
    stat.textContent="Правильно: "+score+" из "+seen;

    var w=el("div","word", dir==="er"?cur.e:cur.r);
    card.appendChild(w);
    if(dir==="er") card.appendChild(el("div","wtr",cur.t));

    var opts=pick(3,cur); opts.push(cur);
    opts.sort(function(){ return Math.random()-.5; });

    var g=el("div","vgrid"), done=false;
    opts.forEach(function(o){
      var b=el("button","opt", dir==="er"?o.r:o.e); b.type="button";
      b.addEventListener("click",function(){
        if(done) return;
        seen++;
        if(o===cur){
          b.classList.add("right"); score++; done=true;
          Array.prototype.forEach.call(g.children,function(y){ y.disabled=true; });
          setTimeout(next,600);
        } else {
          b.classList.add("wrong"); b.disabled=true;
        }
      });
      g.appendChild(b);
    });
    card.appendChild(g);
  }
  setDir(dir);
}
